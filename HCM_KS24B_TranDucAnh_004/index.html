<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranDucAnh_N24DTCN003</title>
    <!-- google-font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Special+Gothic&display=swap"
        rel="stylesheet">
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- style -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="bg-primary text-white text-center py-3">
        <h1>Hệ Thống Quản Lý Công Việc</h1>
    </header>

    <main class="container my-5">
        <div class="container">
            <h2 class="mt-4">Thêm / Cập Nhật Công Việc</h2>
            <section>
                <form id="taskForm">
                    <div class="box1 ">
                        <div class="rol-2 col-6">
                            <label for="nameToDo" class="form-label">Tên Công Việc:</label>
                            <input type="text" id="nameToDo" class="form-control " required>
                            <span class="text-danger" id="nameError" style="display: block;">Không được để trống</span>
                        </div>
                        <div class="rol-2 col-5">
                            <label for="dateToDo" class="form-label">Hạn chót:</label>
                            <input type="date" id="dateToDo" class="form-control" required>
                            <span class="text-danger" id="dateError" style="display: block;">Phải chọn ngày</span>
                        </div>
                    </div>

                    <div class="box2">
                        <div class="rol-2 col-6">
                            <label for="personInCharge" class="form-label">Người Phụ Trách:</label>
                            <input type="text" id="personInCharge" class="form-control" required>
                            <span class="text-danger" id="personError" style="display: block;">Không được để trống</span>
                        </div>

                        <div class="rol-2 col-5">
                            <label for="statusToDo" class="form-label">Trạng thái:</label>
                            <select id="statusToDo" class="form-select" required>
                                <option value="" disabled selected>-- Chọn trạng thái --</option>
                                <option value="Hoàn thành">Hoàn thành</option>
                                <option value="Đang tiến hành">Đang tiến hành</option>
                                <option value="Chưa bắt đầu">Chưa bắt đầu</option>
                            </select>
                            <span class="text-danger" id="statusError" style="display: block;">Vui lòng chọn trạng
                                thái</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success " style="margin-top: 40px;">Thêm Công Việc</button>
                </form>
            </section>

            <section class="mt-5">
                <input type="text" id="searchTask" class="form-control" placeholder="Tìm kiếm theo tên công việc...">
            </section>

            <section class="mt-5">
                <table class="table table-bordered table table-striped">
                    <thead class="text-center bg-primary text-white" >
                        <tr>
                            <th>Công việc</th>
                            <th>Hạn chót</th>
                            <th>Phụ trách</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="taskList" class=" text-center">
                        <!-- render data -->
                    </tbody>
                </table>
            </section>
    </main>
    </div>


    <!-- Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="editModalLabel">Chỉnh Sửa Công Việc</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editTaskForm">
                        <div class="mb-3">
                            <label for="editNameToDo" class="form-label">Tên Công Việc:</label>
                            <input type="text" id="editNameToDo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editDateToDo" class="form-label">Hạn chót:</label>
                            <input type="date" id="editDateToDo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPersonInCharge" class="form-label">Người Phụ Trách:</label>
                            <input type="text" id="editPersonInCharge" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editStatusToDo" class="form-label">Trạng thái:</label>
                            <select id="editStatusToDo" class="form-select" required>
                                <option value="Hoàn thành">Hoàn thành</option>
                                <option value="Đang tiến hành">Đang tiến hành</option>
                                <option value="Chưa bắt đầu">Chưa bắt đầu</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" onclick="saveChanges()">Lưu Thay Đổi</button>
                </div>
            </div>
        </div>
    </div>


    <!-- <footer class="bg-light text-center py-3">
        <p>© 2025 Hệ Thống Quản Lý Công Việc</p>
    </footer> -->

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
</body>

</html>
